<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#F7FAFF;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
/* Hayame how-to video engine. Deterministic: render(t) draws the frame for time t.
   The build script fills SPEC (steps + timing), FONTS, ASSETS (name -> file URL), LOGO, ICONS. */
const SPEC = {{SPEC}};
const FONTS = {{FONTS}};
const ASSETS = {{ASSETS}};
const LOGO = "{{LOGO}}";
const ICONS = {{ICONS}};

const W = SPEC.w, H = SPEC.h, PORTRAIT = H > W;
const NAVY = "#0A2B54", BLUE = "#1484D9", SKY = "#7CCBFF", MIST = "#EDF7FF", INK = "#0A2B54", MUTED = "#5B6B82";
const cv = document.getElementById("c"); cv.width = W; cv.height = H; const ctx = cv.getContext("2d");

/* ---------- helpers ---------- */

const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  outExpo: x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  inOutQuint: x => (x < 0.5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2),

    if (t <= frames[i].t) {
      const a = frames[i - 1], b = frames[i], k = ease(seg(t, a.t, b.t)), out = {};

function setFont(size, weight = 900, tracking = -0.04) { ctx.font = `${weight} ${size}px Geist, sans-serif`; ctx.letterSpacing = `${(tracking * size).toFixed(2)}px`; }

/* ---------- assets ---------- */
const img = {};
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("img " + src)); i.src = src; }); }
async function boot() {
  for (const [w, uri] of Object.entries(FONTS)) { const f = new FontFace("Geist", `url(${uri})`, { weight: String(w) }); document.fonts.add(await f.load()); }
  img.logo = await loadImg(LOGO);
  img.icons = await Promise.all(ICONS.map(loadImg));
  for (const [name, url] of Object.entries(ASSETS)) img[name] = await loadImg(url);
  const m = location.hash.match(/t=([\d.]+)/);
  if (m) { render(parseFloat(m[1])); document.title = "ready"; }
  else { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % SPEC.duration); requestAnimationFrame(loop); })(); }
}

/* ---------- timeline ---------- */
// Each step has absolute start/end (set by the build script). Transition overlap: TR seconds.
const TR = 0.55;
function currentSteps(t) {
  const out = [];
  for (const s of SPEC.steps) {
    const a = s.start - TR, b = s.end + TR;
    if (t >= a && t <= b) out.push(s);
  }
  return out;
}

/* ---------- background ---------- */
const BLOBS = (() => { const r = rng(3); return Array.from({ length: 4 }, (_, i) => ({ x: r(), y: r(), rad: 0.25 + r() * 0.25, sp: 0.03 + r() * 0.03, ph: r() * 6.28, a: 0.10 + r() * 0.08 })); })();
function background(t) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#FFFFFF"); g.addColorStop(0.55, "#F3F8FE"); g.addColorStop(1, "#E6F2FD");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const b of BLOBS) {
    const x = (b.x + Math.sin(t * b.sp * 6 + b.ph) * 0.08) * W, y = (b.y + Math.cos(t * b.sp * 5 + b.ph) * 0.08) * H, rad = b.rad * Math.max(W, H);
    const rg = ctx.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, `rgba(20,132,217,${b.a})`); rg.addColorStop(1, "rgba(20,132,217,0)");
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }

  ctx.fillStyle = "rgba(10,43,84,0.045)";
  const step = PORTRAIT ? 54 : 60, off = (t * 6) % step;
  for (let x = -step; x < W + step; x += step) for (let y = -step; y < H + step; y += step) { ctx.beginPath(); ctx.arc(x + off * 0.3, y + off * 0.3, 1.3, 0, 7); ctx.fill(); }
}

/* ---------- layout ---------- */
// Portrait: text block at top, device below. Landscape: text left, device right.
const L = PORTRAIT
  ? { textX: 84, textY: 230, textW: W - 168, devX: 90, devY: 740, devW: W - 180, devH: H - 740 + 200, progY: 150 }
  : { textX: 96, textY: 300, textW: 640, devX: 800, devY: 96, devW: W - 800 - 72, devH: H - 192, progY: H - 72 };

/* ---------- device frames ---------- */
function drawPhone(x, y, w, screen) {
  // Bezel proportions of an iPhone-style device; screen is a callback drawing inside the clipped screen rect.
  const bez = w * 0.028, rad = w * 0.145, h = w * (2622 / 1206) + bez * 2;
  ctx.save();
  ctx.shadowColor = "rgba(10,43,84,0.28)"; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30;
  ctx.fillStyle = "#0b0f16"; rr(x, y, w, h, rad); ctx.fill();
  ctx.shadowColor = "transparent";

  ctx.save(); rr(sx, sy, sw, sh, rad - bez); ctx.clip(); ctx.fillStyle = "#F7FAFF"; ctx.fillRect(sx, sy, sw, sh);
  screen(sx, sy, sw, sh); ctx.restore();

  ctx.fillStyle = "#000"; rr(x + w / 2 - w * 0.165, sy + sh * 0.012, w * 0.33, sh * 0.03, sh * 0.015); ctx.fill();
  ctx.restore();

}
function drawBrowser(x, y, w, h, url, screen) {
  const bar = 58, rad = 20;
  ctx.save();
  ctx.shadowColor = "rgba(10,43,84,0.22)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24;
  ctx.fillStyle = "#fff"; rr(x, y, w, h, rad); ctx.fill(); ctx.shadowColor = "transparent";
  ctx.save(); rr(x, y, w, h, rad); ctx.clip();
  ctx.fillStyle = "#EEF3F9"; ctx.fillRect(x, y, w, bar);

  ctx.strokeStyle = "rgba(10,43,84,0.08)"; ctx.lineWidth = 1; rr(x + w / 2 - pw / 2, y + 12, pw, bar - 24, 10); ctx.stroke();
  setFont(17, 500, -0.01); ctx.fillStyle = "#3C4A5E"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // tiny lock
  ctx.fillStyle = "#1CA160"; ctx.fillText("🔒", x + w / 2 - ctx.measureText(url).width / 2 - 16, y + bar / 2 + 1);
  ctx.fillStyle = "#3C4A5E"; ctx.fillText(url, x + w / 2 + 8, y + bar / 2 + 1);

  ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip(); ctx.fillStyle = "#fff"; ctx.fillRect(sx, sy, sw, sh); screen(sx, sy, sw, sh); ctx.restore();
  ctx.restore(); ctx.restore();

}

/* ---------- screenshot with scroll + price blur ---------- */
const pixCanvas = document.createElement("canvas");
function drawShot(im, sx, sy, sw, sh, scrollFrac, blurRects) {
  // Fit image to screen width; scroll by a fraction of the image height.
  const scale = sw / im.naturalWidth, ih = im.naturalHeight * scale;
  const maxScroll = Math.max(0, ih - sh), off = clamp(scrollFrac) * maxScroll;
  ctx.drawImage(im, sx, sy - off, sw, ih);
  for (const r of blurRects || []) {
    const bx = r.x * im.naturalWidth, by = r.y * im.naturalHeight, bw = r.w * im.naturalWidth, bh = r.h * im.naturalHeight;
    const dx = sx + r.x * sw, dy = sy - off + r.y * ih, dw = r.w * sw, dh = r.h * ih;
    if (dy + dh < sy || dy > sy + sh) continue;
    const pw = Math.max(2, Math.round(dw / 14)), ph = Math.max(2, Math.round(dh / 14));
    pixCanvas.width = pw; pixCanvas.height = ph; const px = pixCanvas.getContext("2d");
    px.imageSmoothingEnabled = true; px.drawImage(im, bx, by, bw, bh, 0, 0, pw, ph);
    ctx.save(); rr(dx - 4, dy - 4, dw + 8, dh + 8, 10); ctx.clip(); ctx.imageSmoothingEnabled = true;
    ctx.drawImage(pixCanvas, 0, 0, pw, ph, dx - 8, dy - 8, dw + 16, dh + 16);
    ctx.fillStyle = "rgba(247,250,255,0.35)"; ctx.fillRect(dx - 8, dy - 8, dw + 16, dh + 16); ctx.restore();

}
// screenshot fraction -> canvas coordinates (after scroll)
function shotToCanvas(dev, geom, fx, fy) { return { x: dev.sx + fx * dev.sw, y: dev.sy - geom.off + fy * geom.ih }; }

/* ---------- pointer, highlight, overlays ---------- */
function fingerTap(p, t, tapT, alpha = 1) {

  ctx.strokeStyle = `rgba(255,255,255,${0.9 * a})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.stroke();

  if (k !== null) { ctx.strokeStyle = `rgba(20,132,217,${0.75 * (1 - k)})`; ctx.lineWidth = lerp(7, 1, k); ctx.beginPath(); ctx.arc(p.x, p.y, 14 + 70 * E.outCubic(k), 0, 7); ctx.stroke(); }

  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.lineTo(8, 23); ctx.lineTo(14, 36); ctx.lineTo(19, 33.5); ctx.lineTo(13.5, 21); ctx.lineTo(23, 21); ctx.closePath();
  ctx.fillStyle = "#fff"; ctx.fill(); ctx.shadowColor = "transparent"; ctx.strokeStyle = NAVY; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function highlight(rect, k, alpha = 1) {

  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  const pad = 10, x = rect.x - pad, y = rect.y - pad, w = rect.w + pad * 2, h = rect.h + pad * 2;
  ctx.fillStyle = `rgba(10,43,84,${0.28 * k})`;
  ctx.beginPath(); ctx.rect(0, 0, W, H); rr(x, y, w, h, 18); ctx.fill("evenodd");
  ctx.strokeStyle = `rgba(20,132,217,${0.95 * k})`; ctx.lineWidth = 4; ctx.shadowColor = "rgba(20,132,217,0.6)"; ctx.shadowBlur = 24 * k;

function callout(text, x, y, k, align = "left") {

  ctx.shadowColor = "rgba(10,43,84,0.25)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = NAVY; rr(bx, by, w, h, h / 2); ctx.fill(); ctx.shadowColor = "transparent";
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(text, bx + size * 0.7, by + h / 2 + 1);
  ctx.restore();

/* ---------- text block ---------- */
function wrapWords(words, maxW) {
  // words: [{t, c}] -> lines of words that fit maxW at current font
  const lines = [[]]; let lw = 0; const sp = ctx.measureText(" ").width;
  for (const w of words) { const ww = ctx.measureText(w.t).width; if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(w); lw += ww + sp; }
  return lines;
}
function textBlock(step, local, dur, alphaMul = 1) {
  // chip, headline (kinetic words), subline; fades out near the end of the step
  const inK = E.outExpo(seg(local, 0.15, 0.9)), outK = E.inCubic(seg(local, dur - 0.45, dur - 0.05)), a = alphaMul * (1 - outK);
  if (a <= 0 || local < 0.1) return;

  ctx.save(); ctx.globalAlpha = a; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  if (step.chip) {
    const cs = PORTRAIT ? 26 : 18; setFont(cs, 700, 0.08); const cw = ctx.measureText(step.chip.toUpperCase()).width + cs * 1.6, ch = cs * 1.75;
    const ck = E.outBack(seg(local, 0.1, 0.6));

    ctx.fillStyle = "rgba(20,132,217,0.12)"; rr(0, -ch * 0.72, cw, ch, ch / 2); ctx.fill();
    ctx.fillStyle = BLUE; ctx.fillText(step.chip.toUpperCase(), cs * 0.8, 0); ctx.restore();
    y += PORTRAIT ? 86 : 62;
  }
  const hs = PORTRAIT ? 92 : 64; setFont(hs, 900, -0.04);
  const lines = wrapWords(step.title, L.textW); let wi = 0;
  for (const line of lines) {
    let x = L.textX; const sp = ctx.measureText(" ").width;
    for (const w of line) {
      const k = E.outExpo(seg(local, 0.25 + wi * 0.07, 0.85 + wi * 0.07)); wi++;
      ctx.save(); ctx.beginPath(); ctx.rect(x - 10, y - hs * 1.05, ctx.measureText(w.t).width + 20, hs * 1.3); ctx.clip();
      ctx.fillStyle = w.c === "accent" ? BLUE : INK; ctx.fillText(w.t, x, y + (1 - k) * hs * 0.9); ctx.restore();
      x += ctx.measureText(w.t).width + sp;

    for (const line of sl) { ctx.fillText(line.map(w => w.t).join(" "), L.textX, y + (1 - sk) * 16); y += ss * 1.4; }
  }

    if (tk > 0) {
      ctx.globalAlpha = a * tk; setFont(ts, 600, -0.01); const tw = ctx.measureText(step.tip).width + ts * 2.2, th = ts * 2;
      y += PORTRAIT ? 20 : 12; ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(10,43,84,0.12)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6; rr(L.textX, y, tw, th, th / 2); ctx.fill(); ctx.shadowColor = "transparent";
      ctx.fillStyle = BLUE; ctx.fillText("💡", L.textX + ts * 0.6, y + th * 0.68); ctx.fillStyle = INK; ctx.fillText(step.tip, L.textX + ts * 1.7, y + th * 0.68);
    }

/* ---------- progress ---------- */
function progress(t) {
  const steps = SPEC.steps.filter(s => s.kind === "step"); if (!steps.length) return;
  const first = steps[0].start, last = steps[steps.length - 1].end; const a = seg(t, first - 0.6, first) * (1 - seg(t, last, last + 0.6));

  steps.forEach((s, i) => {

  ctx.restore();
}

/* ---------- vector overlays (checkout, confirmation) ---------- */
function checkoutCard(x, y, w, k, t) {
  if (k <= 0) return; const h = w * 1.05, s = lerp(0.9, 1, E.outBack(k));
  ctx.save(); ctx.globalAlpha = clamp(k); ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s); ctx.translate(-w / 2, -h / 2);
  ctx.shadowColor = "rgba(10,43,84,0.35)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24; ctx.fillStyle = "#fff"; rr(0, 0, w, h, 24); ctx.fill(); ctx.shadowColor = "transparent";
  const u = w / 420;

  setFont(20 * u, 700, 0.06); ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText("SECURE CHECKOUT", 28 * u, 36 * u);
  setFont(24 * u, 700, -0.02); ctx.fillStyle = "#fff"; ctx.fillText("Powered by Paystack", 28 * u, 68 * u);
  ctx.fillStyle = "#1CA160"; ctx.beginPath(); ctx.arc(w - 40 * u, 43 * u, 12 * u, 0, 7); ctx.fill(); setFont(14 * u, 900); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("✓", w - 40 * u, 44 * u);
  const opts = [["Mobile Money", "MTN · Telecel · AirtelTigo"], ["Card", "Visa and Mastercard"], ["Bank transfer", "Instant confirmation"]];
  opts.forEach(([a, b], i) => {
    const oy = 112 * u + i * 86 * u, sel = i === 0 && t % 10 > -1;
    ctx.fillStyle = sel ? "rgba(20,132,217,0.08)" : "#F4F8FD"; rr(24 * u, oy, w - 48 * u, 72 * u, 16 * u); ctx.fill();

    setFont(20 * u, 700, -0.02); ctx.fillStyle = INK; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText(a, 78 * u, oy + 31 * u);
    setFont(15 * u, 500, 0); ctx.fillStyle = MUTED; ctx.fillText(b, 78 * u, oy + 55 * u);
  });

  ctx.fillStyle = bg; rr(24 * u, by, w - 48 * u, 56 * u, 14 * u); ctx.fill();
  setFont(20 * u, 700, -0.01); ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("Pay securely", w / 2, by + 29 * u);
  ctx.restore();

}
