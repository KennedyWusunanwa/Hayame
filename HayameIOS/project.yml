name: HayameIOS
options:
  bundleIdPrefix: com.hayame
settings:
  base:
    SWIFT_VERSION: 5.0
    # Set this to the recipient Apple Team ID before regenerating
    # HayameIOS.xcodeproj from this file.
    DEVELOPMENT_TEAM: XJHSMVRVW4
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 1.0.1
packages: {}
targets:
  HayameIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HayameIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hayame.app
        PRODUCT_NAME: Hayame
        INFOPLIST_FILE: HayameIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_DEBUG_DYLIB: NO
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: HayameIOS/HayameIOS.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: HayameIOS/HayameIOS.Release.entitlements
    info:
      path: HayameIOS/Info.plist
      properties:
        CFBundleDisplayName: Hayame
        CFBundleURLTypes:
          - CFBundleURLName: com.hayame.app.paystack
            CFBundleURLSchemes:
              - hayame
              - hayameios
        UILaunchStoryboardName: LaunchScreen
        UIStatusBarHidden: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: Hayame needs photo library access for profile and listing images.
